      no_advance_conditions:
        - "Survivors selected only by top_forward_pf(상위 전진 수익 팩터 단독 생존)."
        - "OOS PF survives but DD collapses(표본외 수익 팩터 유지이나 손실폭 붕괴)."
        - "Validation/OOS split is unclear or OOS was used in selection(검증/표본외 분할 불명확 또는 표본외 선정 사용)."
        - "Same feature family/label/session/trade shape/substrate concentration(동일 피처 계열/라벨/세션/거래 형태/바탕 쏠림)."
        - "Failure cause was not recorded before opening next depth(다음 깊이 개방 전 실패 원인 미기록)."
    claim_rule: "Extra stages may create runtime learning records, preserved clues, negative memory, reference surfaces, invalid setup, blocked retry conditions, or next frontier proposals only; they cannot create completion, selected baseline, operating promotion, runtime authority, live readiness, Goal Achieve, or git-push validation."
  frontier_five_stage_direction_synthesis:
    status: active
    active_by_default: true
    description: "Light five-stage direction synthesis(가벼운 5단계 방향 종합) between per-stage Topic Rotation Guard(단계별 주제 회전 보호) and every-50 Extra Stage(50개마다 추가 단계). It summarizes the latest five closed canonical frontier stages without creating a heavy retrospective."
    trigger_skill: obsidian-stage-transition
    appends_required_skill: false
    appends_required_gate: frontier_five_stage_direction_synthesis
    allowed_families:
      - state_sync
      - policy_skill_governance
      - experiment_design
      - experiment_execution
      - runtime_backtest
      - kpi_evidence
      - artifact_lineage
      - publish_handoff
    activation_rule: "Run for canonical frontier open/continuation packets(정식 전선 개방/계속 묶음), especially at five-frontier block boundaries(5전선 블록 경계). It may read the same latest-five scope(최근 5개 범위) as frontier_topic_rotation_check(전선 주제 회전 점검) but must stay receipt-first and concise(영수증 우선/간결)."
    required_fields:
      - covered_frontier_ids
      - dominant_direction
      - repeated_mechanism
      - overused_axis_warning
      - next_axis_options
      - allowed_reexperiment_conditions
      - adjacent_same_axis_block
      - claim_boundary
    claim_rule: "Allowed claims(허용 주장)은 direction_delta/axis_rotation_hint/adjacent_repeat_warning(방향 변화/축 회전 힌트/인접 반복 경고) only. It cannot create topic abandonment, permanent topic ban, completion, selected baseline, operating promotion, runtime authority, live readiness, Goal Achieve, or Extra Stage authority(주제 폐기/영구 주제 금지/완성/선택 기준선/운영 승격/런타임 권위/실거래 준비/목표 달성/추가 단계 권위 금지)."
  frontier_topic_rotation_check:
    status: active
    active_by_default: true
    description: "Before opening a canonical frontier stage(정식 전선 단계), compare the proposed stage question with the immediate prior frontier stage and latest five closed canonical frontier stages to prevent continuation repair, near-duplicate hypothesis, threshold/filter/session/routing/parameter-only tweak, or renamed repair(연속 수리/근접 중복 가설/임계값/필터/세션/라우팅/파라미터만 미세조정/이름만 바꾼 수리)."
    trigger_skill: obsidian-stage-transition
    appends_required_skill: false
    appends_required_gate: frontier_topic_rotation_check
    allowed_families:
      - state_sync
      - policy_skill_governance
      - experiment_design
      - experiment_execution
      - runtime_backtest
      - kpi_evidence
      - artifact_lineage
      - publish_handoff
    activation_rule: "Run after frontier_extra_stage_due_check(전선 추가 단계 도래 점검) when a resume frontier open(전선 재개 개방) is being created, and before any other canonical frontier open."
    closeout_rule: "Record repair_disposition_closed_in_stage(단계 내 수리 처분 마감), prior_five_frontier_scope(이전 5개 전선 범위), novelty_delta(신규성 차이), and same_surface_repair_block(동일 표면 수리 차단) in the stage open or transition packet."
    claim_rule: "This overlay may support next-frontier-open discipline(다음 전선 개방 규율) only. A failed check blocks only the current proposed next-open shape(현재 제안된 다음 개방 형태), not future reuse of the broad topic(넓은 주제의 미래 재사용). It cannot create completion, selected baseline, operating promotion, runtime authority, live readiness, Goal Achieve, or a topic ban forever(주제 영구 금지)."
