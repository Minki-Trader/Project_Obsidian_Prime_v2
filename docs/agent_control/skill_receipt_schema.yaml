version: skill_receipt_schema_v2
description: "Required content for skill receipts before completed/reviewed/verified claims are allowed."
schemas:
  default:
    required_fields:
      - packet_id
      - skill
      - status
      - primary_output
      - evidence_used
    compact_required_fields:
      - packet_id
      - skill
      - status
      - receipt_mode
      - source_current_truth_docs
      - evidence_used
      - claim_boundary
      - gates_not_run_with_reason
      - forbidden_claims
  obsidian-session-intake:
    required_fields:
      - packet_id
      - skill
      - status
      - intake_context
      - active_stage
      - branch_worktree_fit
      - selected_work_family
      - routing_handoff
  obsidian-work-packet-router:
    required_fields:
      - packet_id
      - skill
      - status
      - primary_family
      - primary_skill
      - support_skills
      - required_gates
      - skills_not_used
      - routing_reason
  obsidian-grok-collaboration:
    retired_archive_only: true
    no_new_receipts: true
    archive_use: "Historical Grok receipts(과거 그록 영수증) may be parsed, but new work must route review/critique/consulting to obsidian-task-force-review."
    required_fields:
      - packet_id
      - skill
      - status
      - trigger_reason
      - review_size
      - direction_before_grok
      - bounded_evidence
      - prompt_identity
      - grok_output_identity
      - advice_classification
      - local_verification
      - forbidden_claim_check
      - final_codex_direction
    compact_when:
      review_size: small
    compact_required_fields:
      - packet_id
      - skill
      - status
      - trigger_reason
      - bounded_evidence
      - advice_classification
      - claim_boundary
      - final_codex_direction
  obsidian-task-force-review:
    actual_subagent_call_required_fields:
      - roster_agent_id
      - spawned_agent_id
      - tool_name
      - result_status
      - opinion_classification
    actual_subagent_call_tool_name: multi_agent_v1.spawn_agent
    full_roster_call_reason_required_when_agents_used_count_at_least: 8
    full_roster_call_rule: "Calling all 8 agents(8명 전원 호출)는 default(기본값)가 아니며, full_roster_call_reason(전원 호출 사유)을 기록해야 한다."
    opinion_classification_allowed:
      - accepted
      - rejected
      - needs_local_verification
    required_fields:
      - packet_id
      - skill
      - status
      - trigger_reason
      - roster_registry
      - agents_used
      - actual_subagent_calls
      - review_requirement
      - model_policy
      - bounded_evidence
      - advice_classification
      - local_verification
      - final_codex_direction
      - forbidden_claim_check
    compact_required_fields:
      - packet_id
      - skill
      - status
      - trigger_reason
      - roster_registry
      - agents_used
      - actual_subagent_calls
      - review_requirement
      - model_policy
      - bounded_evidence
      - advice_classification
      - local_verification
      - claim_boundary
      - final_codex_direction
  obsidian-workflow-drift-guard:
    required_fields:
      - packet_id
      - skill
      - status
      - product
      - material_state
      - tool_state
      - environment_state
      - current_blocker
      - recovery_attempt_or_reason
  obsidian-reentry-read:
    required_fields:
      - packet_id
      - skill
      - status
      - source_current_truth_docs
      - active_stage
      - current_run
      - detected_conflicts
      - allowed_claims
      - forbidden_claims
  obsidian-stage-transition:
    required_fields:
      - packet_id
      - skill
      - status
      - source_current_truth_docs
      - changed_or_checked_docs
      - detected_conflicts
      - canonical_state_after
      - allowed_claims
      - forbidden_claims
  obsidian-architecture-guard:
    required_fields:
      - packet_id
      - skill
      - status
      - touched_surfaces
      - invariant_checks
      - placement_boundary
      - architecture_debt_effect
      - allowed_claims
      - forbidden_claims
  obsidian-code-surface-guard:
