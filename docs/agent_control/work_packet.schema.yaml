version: work_packet_schema_v2_1_compatible
compatibility:
  accepts_v1_packets: archive_only
  accepts_v2_packets: archive_only
  accepts_v2_1_packets: true
  new_packet_required_version: work_packet_schema_v2_1
  prior_versions_claim_boundary: "Prior v1/v2 packets(이전 버전1/2 작업 묶음)은 archive-only(보관 전용)로 읽으며, 새 packet(새 작업 묶음)이나 reviewed/verified/pass(검토됨/검증됨/통과) 근거로 승격하지 않는다."
required_top_level:
  - packet_id
  - created_at_utc
  - user_request
  - current_truth
  - preflight
  - interpreted_scope
  - acceptance_criteria
  - row_grain
  - kpi_contract
  - artifact_contract
  - skill_routing
  - gates
  - final_claim_policy
v2_required_top_level:
  - packet_id
  - created_at_utc
  - user_request
  - current_truth
  - work_classification
  - risk_vector_scan
  - decision_lock
  - interpreted_scope
  - acceptance_criteria
  - work_plan
  - skill_routing
  - evidence_contract
  - gates
  - final_claim_policy
v2_1_required_top_level:
  - packet_lifecycle
  - packet_id
  - created_at_utc
  - user_request
  - current_truth
  - work_classification
  - risk_vector_scan
  - decision_lock
  - interpreted_scope
  - verification_profile
  - acceptance_criteria
  - work_plan
  - skill_routing
  - evidence_contract
  - gates
  - final_claim_policy
v2_interpreted_scope_required_fields:
  - work_families
  - target_surfaces
  - scope_units
  - execution_layers
  - mutation_policy
  - evidence_layers
  - reduction_policy
  - claim_boundary
scope_units_allowed:
  - file
  - document
  - stage
  - run
  - variant
  - code_module
  - kpi_row
  - ledger
  - artifact
  - report
  - policy
  - skill
execution_layers_allowed:
  - read_only
  - document_edit
  - code_edit
  - python_execution
  - mt5_execution
  - kpi_recording
  - ledger_update
  - archive
  - publish
verification_profile_ids_allowed:
  - read_only_minimal
  - design_only
  - static_contract
  - targeted_local_execution
  - proxy_scout
  - experiment_run
  - runtime_learning_probe
  - runtime_probe
  - stage_closeout
  - authority_candidate
  - blocked_pending_decision
fields:
  packet_lifecycle:
    required: true
    allowed:
      - new_packet
      - archive_only
    rule: "New packets(새 작업 묶음)은 work_packet_schema_v2_1(작업 묶음 스키마 버전 2.1)만 사용할 수 있다. Older v1/v2 packets(이전 버전1/2 작업 묶음)은 archive_only(보관 전용)로만 읽는다."
  packet_id:
    required: true
    rule: "Stable id for this unit of work."
  user_request:
    required_fields:
      - user_quote
      - requested_action
      - requested_count
      - ambiguous_terms
  preflight:
    required_fields:
      - needs_clarification
      - selected_option_id
      - selected_option_user_quote
      - blocked_until_answer
    rule: "If needs_clarification is true, execution cannot start until selected_option_user_quote exists."
  interpreted_scope:
    required_fields:
      - variants_requested
      - verification_layers
      - mt5_required
      - top_k_reduction_allowed
      - scope_reduction_requires_user_quote
    v2_required_fields:
      - work_families
      - target_surfaces
      - scope_units
      - execution_layers
      - mutation_policy
      - evidence_layers
      - reduction_policy
      - claim_boundary
  work_classification:
    required_fields:
      - primary_family
      - detected_families
      - touched_surfaces
      - mutation_intent
      - execution_intent
  risk_vector_scan:
    required_fields:
      - risks
      - hard_stop_risks
      - required_decision_locks
      - required_gates
      - forbidden_claims
  verification_profile:
    required_fields:
      - profile_id
      - claim_surface
      - trigger_sources
      - protected_claims
      - required_evidence
      - gates_not_run_with_reason
      - stop_conditions
    profile_ids_reference: verification_profile_ids_allowed
    n_a_reason_required_fields:
      - gate
      - reason_code
      - reason
      - claim_effect
    runtime_required_evidence_terms:
      - dataset_id
      - feature_set_id
      - label_id
      - split_id
      - onnx_hash
      - ea_source_hash
      - ea_binary_hash
      - set_ini_hash
      - feature_order_hash
      - tester_identity
      - report_hash
      - trade_list_hash
      - telemetry_hash
    runtime_learning_probe_decision_required_fields:
      - pre_gate_signal_count
      - strong_candidate_count
      - runtime_learning_probe_candidate_count
      - runtime_surface_status
      - mt5_action
      - not_run_reason_code
      - repair_attempt_required
      - repair_attempts
      - forbidden_skip_basis_seen
      - claim_effect
    runtime_learning_probe_forbidden_not_run_reason_codes:
      - proxy_bad
      - candidate_gate_failed
      - not_strong_candidate
      - pf_dd_poor
      - low_trade_count_expected
      - long_short_imbalanced
      - cost_expensive
      - agent_recommended_skip
      - candidate_0
    runtime_learning_probe_allowed_not_run_reason_codes_after_repair:
      - no_signal_rows_after_repair
      - no_deterministic_decision_rule_after_repair
      - no_entry_exit_translation_after_repair
      - no_runtime_substrate_after_repair
      - data_invalid_pre_runtime
      - mt5_environment_blocked_after_attempt
      - explicit_user_scope_excludes_mt5
    runtime_learning_probe_rule: "runtime_learning_probe(런타임 학습 탐침)는 strong_candidate(강한 후보)와 learning_candidate(학습 후보)를 분리한다. proxy_bad/candidate_gate_failed/not_strong_candidate/cost_expensive(프록시 부진/후보 게이트 실패/강한 후보 아님/비용)는 MT5 not-run reason(미실행 사유)이 아니며, no_actionable_runtime_surface(실행 가능한 런타임 표면 없음)는 repair_attempt(수리 시도) 뒤에만 blocked/inconclusive(차단/불충분)로 닫을 수 있다."
    rule: "For work_packet_schema_v2_1 packets, verification_profile(검증 프로필) is selected before gate execution. Each verification action must have a trigger source(트리거 원천), protected claim(보호 주장), required evidence(필수 근거), and stop condition(중단 조건). Runtime/materialization/handoff/economics claims(런타임/물질화/인계/경제성 주장) require runtime_probe or authority_candidate(런타임 탐침 또는 권위 후보) profile evidence and active verification(능동 검증), and runtime_evidence_gate(런타임 근거 게이트) cannot be skipped for cost/expense(비용) while the runtime claim is protected."
    frontier_direction_rule: "Canonical frontier open/continuation(정식 전선 개방/계속 진행) packets must include frontier_five_stage_direction_synthesis(전선 5단계 방향 종합) as a light direction record(가벼운 방향 기록). It is not topic abandonment or a permanent topic ban(주제 폐기나 영구 금지 아님)."
    frontier_extra_rule: "Broad ONNX/frontier continuation(넓은 온엑스/전선 계속 진행) packets must include frontier_extra_due_check(전선 추가 도래 점검). Frontier Extra closeout(전선 추가 마감) packets must include frontier_extra_mix_depth_lint/runtime_evidence_gate/required_gate_coverage_audit/final_claim_guard(전선 추가 혼합 깊이 점검/런타임 근거 게이트/필수 게이트 커버리지 감사/최종 주장 보호)."
  decision_lock:
    required_fields:
      - mode
      - assumptions
      - questions
      - required_user_decisions
  work_plan:
    required_fields:
      - phases
      - expected_outputs
      - stop_conditions
  evidence_contract:
    required_fields:
      - raw_evidence
      - machine_readable
      - human_readable
  acceptance_criteria:
    item_required_fields:
      - id
      - text
      - expected_artifact
      - verification_method
      - required
  row_grain:
    reference: docs/agent_control/row_grain_contract.yaml
  kpi_contract:
    required_fields:
      - kpi_standard_version
      - normalized_record_path
      - source_authority_reference
      - n_a_reason_reference
  artifact_contract:
    required_fields:
      - raw_evidence
      - machine_readable
      - human_readable
      - external_artifacts
  skill_routing:
    required_fields:
      - primary_family
      - primary_skill
      - support_skills
      - skills_considered
      - skills_selected
      - skills_not_used
      - required_skill_receipts
      - required_gates
    rule: "Values must be derived from docs/agent_control/work_family_registry.yaml before implementation starts."
  gates:
    required_fields:
      - scope_completion_gate
      - skill_receipt_lint
      - kpi_contract_audit
      - artifact_lineage_audit
      - final_claim_guard
  final_claim_policy:
    required_fields:
      - allowed_claims
      - forbidden_claims
      - claim_vocabulary_reference
