stage267_recent_narrative_notes:
- >-
  Run267EF(267EF 실행)는 run267EE(267EE 실행)의 후보 프로필, 음수 구간, 초기화 실패, 중복 KPI(핵심 성과 지표) 서명을 8차 follow-up/prune design(후속/가지치기 설계)으로 바꿨다. Effect(효과): materialization queue(물질화 대기열) `7`개, aggressive rows(공격 행) `2`개, prune matrix(가지치기 행렬) `5`개, failure memory(실패 기억) `6`개를 만들었다. Boundary(경계): selected candidate(선택 후보), selected research baseline(선택 연구 기준 후보), ONNX readiness(온엑스 준비), Goal Achieve(목표 달성)는 계속 `none/not_claimed`다.
- >-
  Run267EJ(267EJ 실행)는 run267EI(267EI 실행)의 tracked report(추적 보고서)를 원천으로 handoff gap(인계 공백), 2026.04 shared state(공유 상태), duplicate signature(중복 서명), validation low-PF watch(검증 낮은 PF 관찰), aggressive non-filter reentry(공격형 비필터 재진입)를 9차 follow-up/prune design(후속/가지치기 설계)으로 바꿨다. Effect(효과): materialization queue(물질화 대기열) `5`개, aggressive rows(공격 행) `1`개, prune matrix(가지치기 행렬) `4`개, failure memory(실패 기억) `4`개를 만들었다. Boundary(경계): selected candidate(선택 후보), selected research baseline(선택 연구 기준 후보), ONNX readiness(온엑스 준비), Goal Achieve(목표 달성)는 계속 `none/not_claimed`다.
- >-
  Run267EK(267EK 실행)는 run267EJ(267EJ 실행)의 queue(대기열)를 MT5(MetaTrader 5, 메타트레이더5) 실행 가능한 feature/model/set/ini(피처/모델/설정/초기화) 입력으로 물질화했다. Effect(효과): variants(변형) `12`개, attempts(시도) `12`개, handoff precheck attempts(인계 사전검사 시도) `4`개, aggressive attempts(공격 시도) `2`개, held rows(보류 행) `1`개를 만들었다. Boundary(경계): selected candidate(선택 후보), selected research baseline(선택 연구 기준 후보), ONNX readiness(온엑스 준비), Goal Achieve(목표 달성)는 계속 `none/not_claimed`다.
