  - bounded_evidence_table
  - grok_receipt
  - codex_local_verification
  - advice_classification
  - compact_retrospective_report
  - next_stage_open_block_check
required_row_fields:
  - stage_id
  - hypothesis
  - proxy_kpi
  - mt5_runtime_probe_kpi
  - proxy_runtime_gap_cause
  - closeout_label
  - preserved_clue
  - negative_memory
  - systemic_repeat
  - next_action
claim_boundary:
  allowed:
    - direction_delta
    - repair_priority_delta
  forbidden:
    - completion
    - baseline
    - promotion
    - runtime_authority
    - live_readiness
    - goal_achieve

